<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Drone body -->
  <ellipse cx="100" cy="62" rx="12" ry="8" fill="#1E293B"/>
  <!-- Camera/sensor -->
  <circle cx="100" cy="68" r="3" fill="#16A34A"/>
  
  <!-- Arms -->
  <line x1="88" y1="58" x2="58" y2="42" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <line x1="112" y1="58" x2="142" y2="42" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <line x1="88" y1="66" x2="65" y2="76" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <line x1="112" y1="66" x2="135" y2="76" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Motor hubs -->
  <circle cx="58" cy="42" r="4" fill="#1E293B"/>
  <circle cx="142" cy="42" r="4" fill="#1E293B"/>
  <circle cx="65" cy="76" r="3.5" fill="#1E293B"/>
  <circle cx="135" cy="76" r="3.5" fill="#1E293B"/>
  
  <!-- Propellers -->
  <ellipse cx="58" cy="42" rx="22" ry="5" fill="#1E293B" opacity="0.7"/>
  <ellipse cx="142" cy="42" rx="22" ry="5" fill="#1E293B" opacity="0.7"/>
  <ellipse cx="65" cy="76" rx="16" ry="4" fill="#1E293B" opacity="0.5"/>
  <ellipse cx="135" cy="76" rx="16" ry="4" fill="#1E293B" opacity="0.5"/>
  
  <!-- Landing gear -->
  <line x1="88" y1="70" x2="82" y2="82" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="112" y1="70" x2="118" y2="82" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="82" x2="88" y2="82" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="82" x2="122" y2="82" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Rolling hills / crop fields -->
  <path d="M20 160 Q60 120 100 140 Q140 160 180 130 L180 200 L20 200 Z" fill="#4ADE80" opacity="0.4"/>
  <path d="M20 170 Q70 140 110 155 Q150 170 180 145 L180 200 L20 200 Z" fill="#22C55E" opacity="0.5"/>
  <path d="M20 180 Q65 160 100 170 Q140 180 180 160 L180 200 L20 200 Z" fill="#16A34A" opacity="0.6"/>
</svg>
